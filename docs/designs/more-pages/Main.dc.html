<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Competitions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEF;font-family:'Barlow',system-ui,sans-serif;color:#212121}
a{color:#17385F}a:hover{color:#0F2A4A}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F7F7F7;font-family:'Barlow',system-ui,sans-serif;color:#212121;overflow:hidden">
<header style="background:#17385F;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;flex:none">
<span aria-hidden="true" style="width:32px;height:32px;border-radius:6px;background:#E12A39;display:flex;align-items:center;justify-content:center;font:700 15px/1 'Barlow Condensed',sans-serif;flex:none">MG</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font:700 22px/1 'Barlow Condensed',sans-serif">Competitions</h1></div>
<button aria-label="Menu" style="width:44px;height:44px;border-radius:10px;border:1px solid #3B5577;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</header>
<div style="background:#17385F;padding:0 12px 12px 16px;display:flex;flex-direction:column;gap:8px;flex:none">
<label style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:8px;background:#fff;color:#5A6270"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search competitions</span><input type="search" placeholder="Name or venue" style="flex:1;min-width:0;border:0;outline:0;font:500 15px/1 'Barlow',sans-serif;color:#212121;background:transparent"></label>
<div style="display:flex;padding:3px;gap:2px;border-radius:8px;background:rgba(255,255,255,.1);align-self:flex-start">
<button style="min-height:32px;padding:0 14px;border-radius:6px;background:#fff;color:#17385F;font:600 13px/1 'Barlow',sans-serif">Upcoming</button>
<button style="min-height:32px;padding:0 14px;border-radius:6px;color:#fff;font:600 13px/1 'Barlow',sans-serif">Past</button>
</div>
</div>
<main style="flex:1;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:14px">
<section style="display:flex;flex-direction:column;gap:6px">
<h2 style="margin:0;padding:0 2px 3px;border-bottom:1.5px solid #17385F;font:700 14px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#17385F">On today</h2>
<div style="display:flex;flex-direction:column;gap:6px;padding:12px 12px 12px 14px;background:#fff;border:1px solid #DADADA;border-radius:10px;box-shadow:inset 3px 0 0 #E12A39;color:#212121">
<span style="display:flex;align-items:center;gap:8px"><span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:#E12A39;color:#fff;font:700 11px/1 'Barlow',sans-serif;letter-spacing:.06em">LIVE</span><strong style="flex:1;font-size:16px;font-weight:700">Hartpury Area Festival</strong></span>
<span style="font-size:13px;color:#5A6270">Hartpury College · Sat 24 – Sun 25 Oct</span>
<span style="font-size:13px;color:#212121">Open · Session 2, Heat 2 on now in Arena 2</span>
<a href="FollowingEvent.dc.html" style="margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:8px;background:#17385F;color:#fff;font-weight:700;font-size:15px;text-decoration:none">Open competition<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
</div>
</section>
<section style="display:flex;flex-direction:column;gap:6px">
<h2 style="margin:0;padding:0 2px 3px;border-bottom:1.5px solid #17385F;font:700 14px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#17385F">Coming up</h2>
<div style="background:#fff;border:1px solid #DADADA;border-radius:10px;overflow:hidden">
<sc-for list="{{ comps }}" as="c" hint-placeholder-count="5">
<a href="Following.dc.html" style="display:grid;grid-template-columns:44px minmax(0,1fr) 14px;align-items:center;column-gap:12px;min-height:60px;padding:8px 10px 8px 12px;box-sizing:border-box;border-top:{{ c.bt }};text-decoration:none;color:#212121">
<span style="display:flex;flex-direction:column;align-items:center;gap:2px"><span style="font:700 22px/1 'Barlow Condensed',sans-serif;color:#17385F">{{ c.day }}</span><span style="font:600 11px/1 'Barlow',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5A6270">{{ c.mon }}</span></span>
<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><strong style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.name }}</strong><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5A6270;white-space:nowrap;overflow:hidden"><span style="overflow:hidden;text-overflow:ellipsis">{{ c.venue }}</span><sc-if value="{{ c.hasTag }}"><span style="flex:none;padding:2px 6px;border-radius:4px;background:{{ c.tagBg }};color:{{ c.tagFg }};font-weight:600">{{ c.tag }}</span></sc-if></span></span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E7480" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</sc-for>
</div>
<button style="min-height:44px;border-radius:8px;border:1px solid #C4C9D1;background:#fff;color:#17385F;font-weight:600;font-size:14px">Load more competitions</button>
</section>
</main>
<nav aria-label="Main" style="flex:none;background:#fff;border-top:1px solid #DADADA;padding:6px 4px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
<a href="Main.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:700 12px/1 'Barlow',sans-serif;color:#17385F;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Events</a>
<a href="Following.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg>Following</a>
<a href="LiveFeeds.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Live</a>
<a href="Dashboard.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TAGS = { open: ['Entries open', '#E6F2EA', '#1E6B3A'], closing: ['Closes Fri', '#FFF4DC', '#8A5A00'], demo: ['Demo event', '#E3E7EC', '#17385F'] };
const COMPS = [
  ['31', 'Oct', 'Cheshire Halloween Pairs', 'Kelsall Hill', 'closing'],
  ['07', 'Nov', 'Northern Winter League R1', 'Myerscough College', 'open'],
  ['14', 'Nov', 'Bicton Arena Individuals', 'Bicton Arena', 'open'],
  ['21', 'Nov', 'Practice event', 'Lower Westfield Farm', 'demo'],
  ['05', 'Dec', 'Christmas Cracker Teams', 'Arena UK', ''],
];
class Component extends DCLogic {
  renderVals() {
    const comps = COMPS.map(([day, mon, name, venue, tag], i) => {
      const t = TAGS[tag];
      return { day, mon, name, venue, hasTag: !!t, tag: t ? t[0] : '', tagBg: t ? t[1] : '', tagFg: t ? t[2] : '', bt: i ? '1px solid #EBEBEB' : '0' };
    });
    return { comps };
  }
}
</script>
</body>
</html>
