<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEF;font-family:'Barlow',system-ui,sans-serif;color:#212121}
a{color:#17385F}a:hover{color:#0F2A4A}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F7F7F7;font-family:'Barlow',system-ui,sans-serif;color:#212121;overflow:hidden;position:relative">
<header style="background:#17385F;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;flex:none">
<span aria-hidden="true" style="width:32px;height:32px;border-radius:6px;background:#E12A39;display:flex;align-items:center;justify-content:center;font:700 15px/1 'Barlow Condensed',sans-serif;flex:none">MG</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font:700 22px/1 'Barlow Condensed',sans-serif">Shop</h1></div>
<button aria-label="Menu" style="width:44px;height:44px;border-radius:10px;border:1px solid #3B5577;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</header>
<div style="background:#17385F;padding:0 12px 12px 16px;display:flex;flex-direction:column;gap:8px;flex:none">
<div style="display:flex;padding:3px;gap:2px;border-radius:8px;background:rgba(255,255,255,.1)">
<button style="flex:1;min-height:34px;border-radius:6px;background:#fff;color:#17385F;font:600 13px/1 'Barlow',sans-serif">Tack and kit</button>
<a href="EventShop.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:34px;border-radius:6px;color:#fff;font:600 13px/1 'Barlow',sans-serif;text-decoration:none">Event shops</a>
</div>
<label style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:8px;background:#fff;color:#5A6270"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search the shop</span><input type="search" placeholder="Saddle, bending poles, 13.2…" style="flex:1;min-width:0;border:0;outline:0;font:500 15px/1 'Barlow',sans-serif;color:#212121;background:transparent"></label>
</div>
<main style="flex:1;overflow-y:auto;padding:12px 12px 84px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ posts }}" as="p" hint-placeholder-count="5">
<a href="Shop.dc.html" style="display:grid;grid-template-columns:72px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:8px 12px 8px 8px;background:#fff;border:1px solid #DADADA;border-radius:10px;text-decoration:none;color:#212121">
<span role="img" aria-label="Photo: {{ p.title }}" style="width:72px;height:72px;border-radius:8px;background:#E3E7EC;display:flex;align-items:center;justify-content:center;color:#6E7480"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6"></path></svg></span>
<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><strong style="font-size:15px;font-weight:600;line-height:1.2">{{ p.title }}</strong><span style="font-size:12px;color:#5A6270">{{ p.where }}</span><span style="font-size:12px;color:#5A6270">{{ p.ago }}</span></span>
<span style="font:700 20px/1 'Barlow Condensed',sans-serif;color:#17385F">{{ p.price }}</span>
</a>
</sc-for>
</main>
<a href="Shop.dc.html" style="position:absolute;right:16px;bottom:86px;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:24px;background:#17385F;color:#fff;font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Sell something</a>
<nav aria-label="Main" style="flex:none;background:#fff;border-top:1px solid #DADADA;padding:6px 4px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Events</a>
<a href="Following.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg>Following</a>
<a href="LiveFeeds.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Live</a>
<a href="Dashboard.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const POSTS = [
  ['Mounted games saddle, 16"', '£180', 'Stockport · collect at Hartpury', '2 h ago'],
  ['Set of 5 bending poles with bases', '£45', 'Cheshire · can post', 'Yesterday'],
  ['Team polo shirts, navy, kids M ×4', '£30', 'Wirral', '2 days ago'],
  ['Flag race flags and cones', '£15', 'Kelsall · collect at Kelsall Hill', '3 days ago'],
  ['13.2 rug, 5\'9", barely used', '£25', 'Stockport', 'Last week'],
];
class Component extends DCLogic {
  renderVals() {
    return { posts: POSTS.map(([title, price, where, ago]) => ({ title, price, where, ago })) };
  }
}
</script>
</body>
</html>
