<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My teams</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEF;font-family:'Barlow',system-ui,sans-serif;color:#212121}
a{color:#17385F}a:hover{color:#0F2A4A}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F7F7F7;font-family:'Barlow',system-ui,sans-serif;color:#212121;overflow:hidden">
<header style="background:#17385F;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 8px;flex:none">
<a href="Dashboard.dc.html" aria-label="Back to Me" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font:700 22px/1 'Barlow Condensed',sans-serif">My teams</h1><span style="font-size:13px;line-height:1.2;color:#C9D4E3">Stockport Pony Club · 3 teams</span></div>
<button aria-label="Menu" style="width:44px;height:44px;border-radius:10px;border:1px solid #3B5577;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</header>
<main style="flex:1;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px">
<article style="background:#fff;border:1px solid #DADADA;border-radius:10px;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;border-bottom:1px solid #EBEBEB">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><strong style="font:700 20px/1 'Barlow Condensed',sans-serif;color:#17385F">Stockport A</strong><span style="font-size:12px;color:#5A6270">Open · 5 riders + reserve</span></span>
<span style="padding:3px 8px;border-radius:4px;background:#E6F2EA;color:#1E6B3A;font-size:12px;font-weight:600">Dec form in</span>
</div>
<div style="display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;column-gap:10px;min-height:52px;padding:6px 12px 6px 14px;background:#FFFBF0;box-shadow:inset 3px 0 0 #C08308">
<span style="font:700 19px/1 'Barlow Condensed',sans-serif;color:#8A5A00">10:54</span>
<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font:600 10px/1 'Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5A6270">Next up</span><span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Open · Heat 3, lane 2 · Arena 2 · +6 min</span></span>
</div>
<div style="display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 8px 6px 14px;border-top:1px solid #EBEBEB">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font:600 10px/1 'Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5A6270">Parent join code</span><span style="font:700 18px/1 'Barlow Condensed',sans-serif;letter-spacing:.08em;color:#212121">STOCKPORT-A</span></span>
<button style="min-height:40px;padding:0 12px;border-radius:8px;border:1px solid #C4C9D1;color:#17385F;font-weight:600;font-size:13px">Copy</button>
<button style="min-height:40px;padding:0 10px;border-radius:8px;color:#17385F;font-weight:600;font-size:13px">Change</button>
</div>
<div style="display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 14px;border-top:1px solid #EBEBEB">
<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">Heat alerts</span><span style="font-size:12px;color:#5A6270">60 minutes before each heat</span></span>
<button role="switch" aria-checked="true" aria-label="Heat alerts" style="width:48px;height:28px;border-radius:14px;background:#17385F;position:relative;flex:none"><span style="position:absolute;top:3px;left:23px;width:22px;height:22px;border-radius:50%;background:#fff"></span></button>
</div>
</article>
<sc-for list="{{ more }}" as="t" hint-placeholder-count="2">
<a href="MyTeams.dc.html" style="display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;column-gap:10px;min-height:64px;padding:8px 10px 8px 14px;background:#fff;border:1px solid #DADADA;border-radius:10px;text-decoration:none;color:#212121">
<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><strong style="font:700 20px/1 'Barlow Condensed',sans-serif;color:#17385F">{{ t.name }}</strong><span style="font-size:12px;color:#5A6270;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.sub }}</span></span>
<span style="padding:3px 8px;border-radius:4px;background:{{ t.bg }};color:{{ t.fg }};font-size:12px;font-weight:600">{{ t.status }}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E7480" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</sc-for>
<a href="MyTeams.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:8px;border:1px dashed #C4C9D1;background:#fff;color:#17385F;font-size:14px;font-weight:600;text-decoration:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Join a team with a code</a>
</main>
<nav aria-label="Main" style="flex:none;background:#fff;border-top:1px solid #DADADA;padding:6px 4px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Events</a>
<a href="Following.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg>Following</a>
<a href="LiveFeeds.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Live</a>
<a href="Dashboard.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:700 12px/1 'Barlow',sans-serif;color:#17385F;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const MORE = [
  ['Stockport B', 'Junior · next 11:00, Heat 1 · Main arena', 'Dec form due', '#FDF1F2', '#A3202C'],
  ['Cheshire Hunt U17', 'Under 17 · next 13:39, Heat 3', 'Dec form in', '#E6F2EA', '#1E6B3A'],
];
class Component extends DCLogic {
  renderVals() {
    return { more: MORE.map(([name, sub, status, bg, fg]) => ({ name, sub, status, bg, fg })) };
  }
}
</script>
</body>
</html>
