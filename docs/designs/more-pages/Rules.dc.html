<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race rules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F7;font-family:'Barlow',system-ui,sans-serif;color:#212121}
a{color:#17385F}a:hover{color:#0F2A4A}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
input,select,textarea{font:400 16px/1.4 'Barlow',sans-serif;color:#212121}
</style>
</helmet>
<div style="min-height:900px;background:#F7F7F7;font-family:'Barlow',system-ui,sans-serif;color:#212121;display:flex;flex-direction:column">
<header style="background:#17385F;color:#fff">
<div style="max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px">
<span aria-hidden="true" style="width:32px;height:32px;border-radius:6px;background:#E12A39;display:flex;align-items:center;justify-content:center;font:700 15px/1 'Barlow Condensed',sans-serif;flex:none">MG</span>
<a href="Admin.dc.html" style="flex:1;font:600 15px/1 'Barlow',sans-serif;color:#C9D4E3;text-decoration:none">Admin</a>
<button aria-label="Menu" style="width:44px;height:44px;border-radius:10px;border:1px solid #3B5577;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</div>
</header>
<main style="flex:1;width:100%;max-width:880px;box-sizing:border-box;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
<h1 style="flex:1;margin:0;font:700 44px/1 'Barlow Condensed',sans-serif;color:#17385F">Race rules</h1>
<button style="display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 18px;border-radius:10px;background:#17385F;color:#fff;font:600 16px/1.1 'Barlow',sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New race</button>
</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px">
<label style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid #C4C9D1;background:#fff;color:#6E7480"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search races</span><input type="search" placeholder="Name, category or rule text" style="flex:1;min-width:0;border:0;outline:0;background:transparent"></label>
<label style="display:flex;align-items:center;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid #C4C9D1;background:#fff"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Category</span><select style="flex:1;min-width:0;border:0;outline:0;background:transparent"><option>All categories</option><option>Bending</option><option>Equipment</option><option>Dismount</option><option>Other</option></select></label>
</div>
<div style="background:#fff;border:1px solid #DADADA;border-radius:12px;overflow:hidden">
<div style="display:flex;flex-direction:column;gap:18px;padding:16px 16px 20px;box-shadow:inset 3px 0 0 #17385F;background:#FBFCFD">
<div style="display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid #17385F"><h2 style="flex:1;margin:0;font:700 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#17385F">Edit race</h2><button style="min-height:40px;padding:0 10px;font:600 14px/1 'Barlow',sans-serif;color:#C8202F">Delete</button></div>
<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px">
<label style="display:flex;flex-direction:column;gap:8px;font:500 16px/1 'Barlow',sans-serif">Name<span style="display:flex;align-items:center;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid #C4C9D1;background:#fff"><input value="Bending Race" style="flex:1;min-width:0;border:0;outline:0;background:transparent"></span></label>
<label style="display:flex;flex-direction:column;gap:8px;font:500 16px/1 'Barlow',sans-serif">Category<span style="display:flex;align-items:center;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid #C4C9D1;background:#fff"><input value="Bending" style="flex:1;min-width:0;border:0;outline:0;background:transparent"></span></label>
</div>
<label style="display:flex;flex-direction:column;gap:8px;font:500 16px/1 'Barlow',sans-serif">One-line summary<span style="display:flex;align-items:center;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid #C4C9D1;background:#fff"><input value="Bend through five poles to the end and back." style="flex:1;min-width:0;border:0;outline:0;background:transparent"></span></label>
<label style="display:flex;flex-direction:column;gap:8px;font:500 16px/1 'Barlow',sans-serif">Rules<span style="display:flex;padding:10px 12px;border-radius:10px;border:1.5px solid #C4C9D1;background:#fff"><textarea rows="4" style="flex:1;min-width:0;border:0;outline:0;background:transparent;resize:vertical">Each rider bends through five poles to the end and back. A knocked-down pole must be put back by the rider who knocked it before continuing. A missed pole is corrected from the point of error.</textarea></span></label>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font:500 16px/1 'Barlow',sans-serif">Diagram</span>
<div role="img" aria-label="Diagram: five bending poles in a line from start to changeover" style="display:flex;align-items:center;justify-content:space-between;gap:8px;height:110px;padding:0 28px;border:1.5px solid #C4C9D1;border-radius:10px;background:#fff">
<span style="font:700 12px/1 'Barlow',sans-serif;letter-spacing:.06em;color:#5A6270">START</span>
<sc-for list="{{ poles }}" as="p" hint-placeholder-count="5"><span style="width:6px;height:44px;border-radius:3px;background:#E12A39"></span></sc-for>
<span style="font:700 12px/1 'Barlow',sans-serif;letter-spacing:.06em;color:#5A6270">CHANGE</span>
</div>
<button style="align-self:flex-start;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid #C4C9D1;color:#17385F;font:600 15px/1 'Barlow',sans-serif">Edit diagram</button>
</div>
<div style="display:flex;gap:12px;justify-content:flex-end"><button style="min-height:50px;padding:0 18px;border-radius:10px;border:1.5px solid #C4C9D1;background:#fff;color:#17385F;font:600 16px/1.1 'Barlow',sans-serif">Cancel</button><button style="min-height:50px;padding:0 18px;border-radius:10px;background:#17385F;color:#fff;font:600 16px/1.1 'Barlow',sans-serif">Save</button></div>
</div>
<sc-for list="{{ races }}" as="r" hint-placeholder-count="5">
<button style="width:100%;display:grid;grid-template-columns:minmax(0,1fr) 120px 20px;column-gap:12px;align-items:center;min-height:60px;padding:6px 14px 6px 16px;border-top:1px solid #EBEBEB;text-align:left"><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><strong style="font-size:16px;font-weight:600">{{ r.name }}</strong><span style="font-size:13px;color:#5A6270;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.summary }}</span></span><span style="font-size:13px;color:#5A6270">{{ r.cat }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7480" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
const RACES = [
  ['Speed Weave', 'Weave the poles out, weave back with the baton.', 'Bending'],
  ['Flag Race', 'Move flags between cones at each end.', 'Equipment'],
  ['Sack Race', 'Ride to the sack, run back in it leading the pony.', 'Dismount'],
  ['Five Flag', 'Carry five flags one at a time to the holder.', 'Equipment'],
  ['Mug Race', 'Move mugs between poles without dropping them.', 'Equipment'],
];
class Component extends DCLogic {
  renderVals() {
    return { races: RACES.map(([name, summary, cat]) => ({ name, summary, cat })), poles: [1, 2, 3, 4, 5] };
  }
}
</script>
</body>
</html>
