<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Following</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEF;font-family:'Barlow',system-ui,sans-serif;color:#212121}
a{color:#17385F}a:hover{color:#0F2A4A}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F7F7F7;font-family:'Barlow',system-ui,sans-serif;color:#212121;overflow:hidden">
<header style="background:#17385F;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;flex:none">
<span aria-hidden="true" style="width:32px;height:32px;border-radius:6px;background:#E12A39;display:flex;align-items:center;justify-content:center;font:700 15px/1 'Barlow Condensed',sans-serif;flex:none">MG</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font:700 22px/1 'Barlow Condensed',sans-serif">Following</h1><span style="font-size:13px;line-height:1.2;color:#C9D4E3">5 teams · 2 events</span></div>
<button aria-label="Menu" style="width:44px;height:44px;border-radius:10px;border:1px solid #3B5577;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</header>
<main style="flex:1;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:16px">
<sc-for list="{{ events }}" as="e" hint-placeholder-count="2">
<section style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:baseline;gap:8px;padding:0 2px 3px;border-bottom:1.5px solid #17385F">
<h2 style="flex:1;margin:0;font:700 14px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#17385F">{{ e.name }}</h2>
<sc-if value="{{ e.live }}"><span style="font:700 11px/1 'Barlow',sans-serif;letter-spacing:.06em;color:#E12A39">LIVE</span></sc-if>
<span style="font:500 12px/1 'Barlow',sans-serif;color:#5A6270">{{ e.when }}</span>
</div>
<div style="background:#fff;border:1px solid #DADADA;border-radius:10px;overflow:hidden">
<sc-for list="{{ e.teams }}" as="t" hint-placeholder-count="3">
<a href="FollowingEvent.dc.html" style="display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;column-gap:10px;min-height:52px;padding:6px 12px;box-sizing:border-box;border-top:{{ t.bt }};background:{{ t.bg }};box-shadow:{{ t.bar }};text-decoration:none;color:#212121">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#C08308" stroke="#C08308" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg>
<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><strong style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.name }}</strong><span style="font-size:12px;color:{{ t.subColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.sub }}</span></span>
<span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span style="font:700 19px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;color:{{ t.timeColor }}">{{ t.time }}</span><span style="font:600 10px/1 'Barlow',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5A6270">{{ t.timeLabel }}</span></span>
</a>
</sc-for>
</div>
</section>
</sc-for>
<a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:8px;border:1px dashed #C4C9D1;background:#fff;color:#17385F;font-size:14px;font-weight:600;text-decoration:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Follow teams at another event</a>
</main>
<nav aria-label="Main" style="flex:none;background:#fff;border-top:1px solid #DADADA;padding:6px 4px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Events</a>
<a href="Following.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:700 12px/1 'Barlow',sans-serif;color:#17385F;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg>Following</a>
<a href="LiveFeeds.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Live</a>
<a href="Dashboard.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 12px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const EVENTS = [
  { name: 'Hartpury Area Festival', when: 'Today', live: true, teams: [
    ['Stockport A', 'Open · Heat 3, lane 2 · Arena 2', '10:54', 'Next heat', 'late'],
    ['Stockport B', 'Junior · Heat 1, lane 4 · Main arena', '11:00', 'Next heat', 'ok'],
    ['Cheshire Hunt U17', 'Under 17 · 3rd after Session 1', '13:39', 'Next heat', 'ok'],
  ] },
  { name: 'Northern Winter League R1', when: 'Sat 7 Nov', live: false, teams: [
    ['Stockport A', 'Open · not drawn yet', '–', 'Heats TBC', 'wait'],
    ['Wirral Pairs 2', 'Pairs · not drawn yet', '–', 'Heats TBC', 'wait'],
  ] },
];
class Component extends DCLogic {
  renderVals() {
    const events = EVENTS.map((e) => ({ ...e, teams: e.teams.map(([name, sub, time, timeLabel, st], i) => ({
      name, sub, time, timeLabel, bt: i ? '1px solid #EBEBEB' : '0',
      bg: st === 'late' ? '#FFFBF0' : '#fff', bar: st === 'late' ? 'inset 3px 0 0 #C08308' : 'none',
      timeColor: st === 'late' ? '#8A5A00' : st === 'wait' ? '#6E7480' : '#17385F',
      subColor: '#5A6270',
    })) }));
    return { events };
  }
}
</script>
</body>
</html>
