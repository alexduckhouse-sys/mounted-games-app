<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEF;font-family:'Barlow',system-ui,sans-serif;color:#212121}
a{color:#17385F}a:hover{color:#0F2A4A}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F7F7F7;font-family:'Barlow',system-ui,sans-serif;color:#212121;overflow:hidden">
<header style="background:#17385F;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 8px;flex:none">
<a href="Shop.dc.html" aria-label="Back to shop" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font:700 22px/1 'Barlow Condensed',sans-serif">Event shop</h1><span style="font-size:13px;line-height:1.2;color:#C9D4E3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Northern Winter League R1 · 7 Nov</span></div>
<button aria-label="Menu" style="width:44px;height:44px;border-radius:10px;border:1px solid #3B5577;display:flex;align-items:center;justify-content:center;flex:none;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</header>
<main style="flex:1;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:16px">
<p style="margin:0;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:#E3E7EC;font-size:13px;line-height:1.4;color:#17385F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>Collect at the Secretary's tent.</p>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<section style="display:flex;flex-direction:column;gap:6px">
<h2 style="margin:0;padding:0 2px 3px;border-bottom:1.5px solid #17385F;font:700 14px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#17385F">{{ g.title }}</h2>
<div style="background:#fff;border:1px solid #DADADA;border-radius:10px;overflow:hidden">
<sc-for list="{{ g.items }}" as="i" hint-placeholder-count="2">
<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;min-height:64px;padding:8px 8px 8px 12px;border-top:{{ i.bt }};background:{{ i.bg }}">
<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><strong style="font-size:15px;font-weight:600">{{ i.name }}</strong><span style="font-size:12px;color:#5A6270">{{ i.note }}</span><span style="font:700 17px/1 'Barlow Condensed',sans-serif;color:#17385F">{{ i.price }}</span></span>
<span style="display:flex;align-items:center;border:1px solid #C4C9D1;border-radius:8px;overflow:hidden">
<button aria-label="One fewer {{ i.name }}" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#17385F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="min-width:28px;text-align:center;font:700 17px/1 'Barlow Condensed',sans-serif">{{ i.qty }}</span>
<button aria-label="One more {{ i.name }}" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#17385F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:10px 12px;background:#0F2A4A;color:#fff">
<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#C9D4E3">3 items</span><strong style="font:700 22px/1 'Barlow Condensed',sans-serif">£62.00</strong></span>
<a href="EventShop.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 20px;border-radius:8px;background:#E12A39;color:#fff;font-weight:700;font-size:15px;text-decoration:none">Review order</a>
</div>
<nav aria-label="Competition" style="flex:none;background:#fff;border-top:1px solid #DADADA;padding:6px 4px 10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<a href="FollowingEvent.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font:500 11px/1 'Barlow',sans-serif;color:#5A6270;text-decoration:none;text-align:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.d }}"></path></svg>{{ t.label }}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TABS = [
  ['Timetable', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2'],
  ['Toplists', 'M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3'],
  ['Live & stream', 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],
  ['Details', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01'],
  ['Me', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0'],
];
const GROUPS = [
  { title: 'Stabling and camping', items: [['Stable, Friday night', 'Shavings included · 14 left', '£25.00', 1], ['Electric hook-up', 'Per night', '£12.00', 0]] },
  { title: 'Kit', items: [['Event hoodie', 'Navy', '£25.00', 1], ['Rider rosette', 'Every rider', '£4.00', 1], ['Photo package', 'One rider, emailed', '£20.00', 0]] },
];
class Component extends DCLogic {
  renderVals() {
    const groups = GROUPS.map((g) => ({ title: g.title, items: g.items.map(([name, note, price, qty], i) => ({ name, note, price, qty, bt: i ? '1px solid #EBEBEB' : '0', bg: qty ? '#F4F7FB' : '#fff' })) }));
    return { groups, tabs: TABS.map(([label, d]) => ({ label, d })) };
  }
}
</script>
</body>
</html>
