document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-width:0\"><span style=\"font:600 14px Barlow;color:#4A505A\">Team name<\u002Fspan><input value=\"{{ team }}\" sc-camel-on-change=\"{{ setTeam }}\" placeholder=\"e.g. Stockport C\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<label style=\"grid-column:1/-1;display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Bibs<\u002Fspan><input value=\"{{ bibs }}\" sc-camel-on-change=\"{{ setBibs }}\" placeholder=\"e.g. Yellow with navy stars\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Trainer name<\u002Fspan><input value=\"{{ trainer }}\" sc-camel-on-change=\"{{ setTrainer }}\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Phone number<\u002Fspan><input value=\"{{ phone }}\" sc-camel-on-change=\"{{ setPhone }}\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #DADADA;border-radius:12px;overflow:hidden\">\n<sc-for list=\"{{ slots }}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"border-bottom:1px solid #EBEBEB;background:{{ s.bg }};box-shadow:{{ s.shadow }}\">\n<sc-if value=\"{{ s.filled }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:72px;padding:0 10px 0 18px\">\n<button sc-camel-on-click=\"{{ s.onSelect }}\" style=\"all:unset;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0\">\n<span style=\"display:flex;align-items:center;gap:8px;font:600 17px/1.2 Barlow\">{{ s.name }}<sc-if value=\"{{ s.isReserve }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:700 11px/1 Barlow;letter-spacing:.06em;text-transform:uppercase;color:#4A505A;border:1px solid #C4C9D1;border-radius:4px;padding:3px 5px\">Reserve<\u002Fspan><\u002Fsc-if><\u002Fspan>\n<span style=\"font:400 14px Barlow;color:#5A6270\">{{ s.meta }}<\u002Fspan>\n<\u002Fbutton>\n<div style=\"display:flex;align-items:center;gap:2px\">\n<button sc-camel-on-click=\"{{ s.onRemove }}\" title=\"Remove\" style=\"width:40px;height:40px;border:0;background:transparent;border-radius:8px;color:#5A6270;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#FDF1F2;color:#C8202F\"><lu-icon name=\"x\" size=\"18\"><\u002Flu-icon><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ s.empty }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ s.onSelect }}\" style=\"all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:72px;padding:0 18px\">\n<span style=\"font:600 17px Barlow;color:{{ s.labelColor }}\">{{ s.label }}<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:6px;font:600 15px Barlow;color:#17385F\"><lu-icon name=\"plus\" size=\"18\"><\u002Flu-icon>{{ s.cta }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Notes for the organisers <span style=\"font-weight:400;color:#5A6270\">(optional)<\u002Fspan><\u002Fspan><input value=\"{{ notes }}\" sc-camel-on-change=\"{{ setNotes }}\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<\u002Fsection>\n\n<section style=\"position:sticky;top:24px;background:#fff;border:1.5px solid #17385F;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px\">\n<sc-if value=\"{{ hasActive }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;align-items:center;gap:12px\"><h2 style=\"flex:1;margin:0;font:700 28px/1 'Barlow Condensed';color:#17385F\">{{ panelTitle }}<\u002Fh2><button sc-camel-on-click=\"{{ closePanel }}\" title=\"Close\" style=\"width:44px;height:44px;border:1px solid #C4C9D1;border-radius:10px;background:#fff;color:#17385F;display:flex;align-items:center;justify-content:center\"><lu-icon name=\"x\" size=\"18\"><\u002Flu-icon><\u002Fbutton><\u002Fdiv>\n\n<sc-if value=\"{{ showSaved }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font:600 14px Barlow;color:#4A505A\">Pick a saved rider<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ saved }}\" as=\"r\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ r.onPick }}\" style=\"min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid {{ r.bd }};background:{{ r.bg }};color:{{ r.fg }};font:600 15px Barlow\">{{ r.name }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 13px Barlow;color:#5A6270;margin-top:6px\"><span style=\"flex:1;height:1px;background:#DADADA\"><\u002Fspan>or type a new one<span style=\"flex:1;height:1px;background:#DADADA\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px\">\n<label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Rider<\u002Fspan><input value=\"{{ form.name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Full name\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Date of birth<\u002Fspan><input value=\"{{ form.dob }}\" sc-camel-on-change=\"{{ setDob }}\" placeholder=\"dd/mm/yyyy\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<sc-if value=\"{{ isRider }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px\"><label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Pony<\u002Fspan><input value=\"{{ form.pony }}\" sc-camel-on-change=\"{{ setPony }}\" placeholder=\"Pony's name\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 14px Barlow;color:#4A505A\">Height (hh)<\u002Fspan><input value=\"{{ form.hh }}\" sc-camel-on-change=\"{{ setHh }}\" placeholder=\"13.2\" style=\"min-height:48px;border:1.5px solid #C4C9D1;border-radius:8px;padding:0 14px;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n\n\n<button sc-camel-on-click=\"{{ addRider }}\" style=\"min-height:50px;border:0;border-radius:10px;background:{{ addBg }};color:{{ addFg }};display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px Barlow;cursor:{{ addCursor }}\">{{ addLabel }}<\u002Fbutton>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ noActive }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n<lu-icon name=\"circle-check\" size=\"28\" style=\"color:#17385F\"><\u002Flu-icon>\n<h2 style=\"margin:0;font:700 28px/1 'Barlow Condensed';color:#17385F\">{{ doneTitle }}<\u002Fh2>\n<span style=\"font:400 16px/1.45 Barlow;color:#4A505A\">{{ doneText }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fmain>\n\n<footer style=\"position:sticky;bottom:0;background:#fff;border-top:1px solid #DADADA\">\n<div style=\"max-width:1160px;margin:0 auto;padding:14px 24px;box-sizing:border-box;display:flex;align-items:center;gap:24px\">\n<span style=\"flex:1;font:500 15px Barlow;color:#4A505A\">{{ status }}<\u002Fspan>\n<label style=\"display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font:500 15px Barlow;color:#212121\"><input type=\"checkbox\" checked=\"{{ terms }}\" sc-camel-on-change=\"{{ toggleTerms }}\" style=\"width:22px;height:22px;margin:0;accent-color:#17385F;cursor:pointer;flex-shrink:0\"><span>I agree to the <a href=\"#\" sc-camel-on-click=\"{{ openTerms }}\" style=\"color:#17385F;font-weight:600;text-decoration:underline;text-underline-offset:2px\">terms and conditions<\u002Fa><\u002Fspan><\u002Flabel>\n<button sc-camel-on-click=\"{{ submit }}\" style=\"min-height:48px;padding:0 22px;border:0;border-radius:10px;background:{{ submitBg }};color:{{ submitFg }};font:600 16px Barlow;cursor:{{ submitCursor }}\">{{ submitLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SAVED = [\n  { name: 'Ella Hughes', dob: '05/04/2015', pony: 'Pickle', hh: '13.2' },\n  { name: 'Oliver Smith', dob: '12/09/2014', pony: 'Bramble', hh: '14.0' },\n  { name: 'Maisie Clarke', dob: '22/01/2016', pony: 'Toffee', hh: '12.3' },\n  { name: 'Harry Wood', dob: '30/06/2015', pony: 'Jasper', hh: '13.1' },\n  { name: 'Ruby Ash', dob: '14/03/2016', pony: 'Domino', hh: '12.2' },\n  { name: 'Leo Grant', dob: '02/11/2015', pony: 'Biscuit', hh: '13.0' },\n  { name: 'Isla Moss', dob: '19/07/2016', pony: 'Pepper', hh: '12.1' },\n];\nconst EMPTY = { name: '', dob: '', pony: '', hh: '' };\n\nclass Component extends DCLogic {\n  state = {\n    slots: [SAVED[0], SAVED[1], SAVED[2], null, null, null],\n    captain: 0,\n    active: 3,\n    editing: false,\n    form: { ...EMPTY },\n    agreed: false,\n    bibs: 'Yellow with navy stars',\n    phone: '07700 900123',\n    trainer: 'Alex Morgan',\n    team: 'Stockport C',\n    notes: '',\n    submitted: false,\n    terms: false,\n  };\n\n  firstEmpty(slots) { const i = slots.findIndex((s) => !s); return i < 0 ? null : i; }\n\n  select(i) {\n    const r = this.state.slots[i];\n    this.setState({ active: i, editing: !!r, form: r ? { ...r } : { ...EMPTY }, agreed: !!r });\n  }\n\n  setForm(patch) {\n    this.setState((s) => ({ form: { ...s.form, ...patch }, agreed: s.editing ? s.agreed : (patch.name !== undefined && patch.name !== s.form.name ? false : s.agreed) }));\n  }\n\n  add() {\n    const { form, agreed, active, slots } = this.state;\n    if (!this.canAdd()) return;\n    const next = slots.slice();\n    next[active] = { ...form, name: form.name.trim() };\n    const nextActive = this.firstEmpty(next);\n    this.setState({ slots: next, active: nextActive, editing: false, form: { ...EMPTY }, agreed: false, submitted: false });\n  }\n\n  canAdd() {\n    const { form, agreed, active } = this.state;\n    if (active == null || !form.name.trim() || !form.dob.trim()) return false;\n    return active === 5 || (form.pony.trim() && form.hh.trim());\n  }\n\n  move(i, d) {\n    const j = i + d;\n    if (j < 0 || j > 5) return;\n    this.setState((s) => {\n      const next = s.slots.slice();\n      [next[i], next[j]] = [next[j], next[i]];\n      let cap = s.captain;\n      if (cap === i) cap = j; else if (cap === j) cap = i;\n      let act = s.active;\n      if (act === i) act = j; else if (act === j) act = i;\n      return { slots: next, captain: cap, active: act, submitted: false };\n    });\n  }\n\n  remove(i) {\n    this.setState((s) => {\n      const next = s.slots.slice();\n      next[i] = null;\n      return { slots: next, captain: s.captain === i ? null : s.captain, active: i, editing: false, form: { ...EMPTY }, agreed: false, submitted: false };\n    });\n  }\n\n  renderVals() {\n    const { slots, captain, active, editing, form, agreed, submitted } = this.state;\n    const inTeam = new Set(slots.filter(Boolean).map((r) => r.name));\n    const filled = slots.filter(Boolean).length;\n    const main = slots.slice(0, 5).filter(Boolean).length;\n    const teamFull = main === 5;\n    const canSubmit = teamFull && this.state.terms;\n    const isReserveSlot = active === 5;\n    const first = form.name.trim().split(' ')[0] || 'This rider';\n    const ponyName = form.pony.trim() || 'their pony';\n    const ok = !!this.canAdd();\n\n    return {\n      bibs: this.state.bibs, phone: this.state.phone, notes: this.state.notes,\n      setBibs: (e) => this.setState({ bibs: e.target.value }),\n      setPhone: (e) => this.setState({ phone: e.target.value }),\n      trainer: this.state.trainer,\n      team: this.state.team,\n      teamTitle: this.state.team.trim() || 'Team name',\n      setTeam: (e) => this.setState({ team: e.target.value }),\n      setTrainer: (e) => this.setState({ trainer: e.target.value }),\n      setNotes: (e) => this.setState({ notes: e.target.value }),\n      submitted,\n\n      slots: slots.map((r, i) => {\n        const isActive = i === active;\n        return {\n          n: i + 1,\n          filled: !!r, empty: !r,\n          name: r ? r.name : '',\n          meta: r ? (i === 5 ? `Non-riding · born ${r.dob}` : `${r.pony} · ${r.hh} hh · born ${r.dob}`) : '',\n          isCaptain: !!r && captain === i,\n          isReserve: !!r && i === 5,\n          canCaptain: !!r && captain !== i && i < 5,\n          label: i === 5 ? 'Non-riding reserve (optional)' : 'Rider',\n          cta: isActive ? 'Adding' : 'Add',\n          numColor: isActive ? '#17385F' : '#A3A9B3',\n          labelColor: isActive ? '#17385F' : '#5A6270',\n          bg: isActive ? '#E3E7EC' : '#fff',\n          shadow: isActive ? 'inset 4px 0 0 #17385F' : 'none',\n          upOpacity: i === 0 ? 0.3 : 1,\n          downOpacity: 1,\n          onSelect: () => this.select(i),\n          onRemove: () => this.remove(i),\n          onUp: () => this.move(i, -1),\n          onDown: () => this.move(i, 1),\n          onCaptain: () => this.setState({ captain: i, submitted: false }),\n        };\n      }),\n\n      hasActive: active != null,\n      noActive: active == null,\n      panelTitle: active == null ? '' : (isReserveSlot ? (editing ? 'Edit reserve' : 'Add a non-riding reserve') : (editing ? 'Edit rider' : 'Add a rider')),\n      isRider: !isReserveSlot,\n      closePanel: () => this.setState({ active: null, editing: false, form: { ...EMPTY }, agreed: false }),\n      showSaved: !editing,\n      saved: SAVED.filter((r) => !inTeam.has(r.name)).map((r) => {\n        const on = form.name === r.name;\n        return {\n          name: r.name,\n          bd: on ? '#17385F' : '#C4C9D1', bg: on ? '#17385F' : '#fff', fg: on ? '#fff' : '#17385F',\n          onPick: () => this.setState({ form: isReserveSlot ? { ...EMPTY, name: r.name, dob: r.dob } : { ...r }, agreed: false }),\n        };\n      }),\n      form,\n      setName: (e) => this.setForm({ name: e.target.value }),\n      setDob: (e) => this.setForm({ dob: e.target.value }),\n      setPony: (e) => this.setForm({ pony: e.target.value }),\n      setHh: (e) => this.setForm({ hh: e.target.value }),\n\n      showAgree: form.name.trim().length > 0,\n      agreeText: isReserveSlot ? `${first} is a member of Stockport PC and eligible for U10, and a parent or guardian has agreed to ${first} taking part.` : `${first} is a member of Stockport PC and eligible for U10, ${ponyName} is fit to compete, and a parent or guardian has agreed to ${first} taking part.`,\n      toggleAgree: () => this.setState((s) => ({ agreed: !s.agreed })),\n      agreeBorder: agreed ? '#17385F' : '#C4C9D1',\n      agreeBoxBorder: agreed ? '#17385F' : '#A3A9B3',\n      agreeBoxBg: agreed ? '#17385F' : '#fff',\n\n      addRider: () => this.add(),\n      addLabel: editing ? 'Save' : (isReserveSlot ? 'Add reserve' : 'Add rider'),\n      addBg: ok ? '#17385F' : '#E3E7EC',\n      addFg: ok ? '#fff' : '#6E7480',\n      addCursor: ok ? 'pointer' : 'not-allowed',\n\n      terms: this.state.terms,\n      toggleTerms: () => this.setState((s) => ({ terms: !s.terms, submitted: false })),\n      openTerms: (e) => { e.preventDefault(); e.stopPropagation(); },\n      termsBorder: this.state.terms ? '#17385F' : '#A3A9B3',\n      termsBg: this.state.terms ? '#17385F' : '#fff',\n      doneTitle: teamFull ? 'Team complete' : 'Pick a slot',\n      doneText: teamFull ? 'Check the riders, agree to the terms, then submit. You can come back and change it until Fri 23 Oct, 18:00.' : 'Click an empty slot to add a rider.',\n\n      status: submitted ? 'Submitted' : (teamFull ? (this.state.terms ? 'Ready to submit' : 'Tick to agree, then submit') : `${main} of 5 riders added`),\n      submit: () => { if (canSubmit) this.setState({ submitted: true, active: null }); },\n      submitLabel: submitted ? 'Submitted' : 'Submit dec form',\n      submitBg: canSubmit && !submitted ? '#17385F' : '#E3E7EC',\n      submitFg: canSubmit && !submitted ? '#fff' : '#6E7480',\n      submitCursor: canSubmit && !submitted ? 'pointer' : 'default',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
