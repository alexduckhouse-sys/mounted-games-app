# Render API hosting with persistent data in Neon PostgreSQL.
# Deploy: push this repo to GitHub, then visit https://render.com → New → Blueprint → pick the repo.
#
# Free tier caveats (fine for dev, not for a live event):
#   - The service SLEEPS after 15 minutes of inactivity; first request after wake takes ~30–60s
#     and SignalR sockets drop. Reconnect on the client is automatic but introduces a hiccup.
#   - Local files are ephemeral. Competition data lives in Neon, outside this container.
# Apply the PostgreSQL migrations before deploying; see docs/neon-setup.md.

services:
  - type: web
    name: mounted-games-scoreboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Database__Provider
        value: postgres
      - key: Database__SeedDemoData
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: Cors__Origins__0
        value: https://mounted-games-app.vercel.app
      - key: Cors__Origins__1
        value: https://mounted-games-app-alexduckhouse-sys-projects.vercel.app
      # Render generates a strong random value once and re-uses it across deploys.
      - key: Jwt__Key
        generateValue: true
      # Set this in the Render dashboard ("Environment" tab) after first deploy.
      # Any non-empty string works — it's the shared admin key for the Organiser sign-in.
      - key: Admin__Key
        sync: false
