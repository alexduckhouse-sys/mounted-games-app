# Fly.io deployment for the Mounted Games scoreboard.
# App name resolves to https://mounted-games-scoreboard.fly.dev
app = "mounted-games-scoreboard"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  # SQLite lives on the mounted volume so it survives restarts/redeploys.
  ConnectionStrings__Default = "Data Source=/data/mg.db"
  # CORS isn't strictly needed (SPA is same-origin) but be explicit anyway.
  Cors__Origins__0 = "https://mounted-games-scoreboard.fly.dev"

[[mounts]]
  source = "mg_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SignalR is always-on; don't let Fly stop the machine between requests.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  # 512 MB is enough for ~100 concurrent users on this app.
  # Bump to 1024 if you ever see OOMs in the Fly logs.
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  # Roll deploys: bring the new one up, check /healthz, then swap.
  strategy = "rolling"
