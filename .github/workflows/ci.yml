name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test with coverage
        run: dotnet test tests/MountedGames.Api.Tests --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/cov"
      - name: Enforce API line coverage
        run: python3 scripts/api-coverage.py "$RUNNER_TEMP"/cov/*/coverage.cobertura.xml --files --min 95

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The node --test suite, then Vitest with its 97% coverage gate (vitest.config.ts).
      - run: node --test tests/*.test.mjs
      - run: npm run test:coverage
      - run: npm run build
